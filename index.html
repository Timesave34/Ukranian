<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn Ukrainian</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e9c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ukrainian">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--surface:#fffdf7;--ink:#14213d;--muted:#5b6579;--blue:#1f4e9c;--gold:#e0a800;--line:#d9d3c0;--good:#2f7d4f;--bad:#b3392f;--pink:#c2255c;--pinkbg:#fde8f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a30;--surface:#17253f;--ink:#f1ecdc;--muted:#9fabc4;--blue:#7fa8ec;--gold:#f2c230;--line:#2c3c5c;--good:#6cc58c;--bad:#f08a80;--pink:#f783ac;--pinkbg:#3a1f33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a30;--surface:#17253f;--ink:#f1ecdc;--muted:#9fabc4;--blue:#7fa8ec;--gold:#f2c230;--line:#2c3c5c;--good:#6cc58c;--bad:#f08a80;--pink:#f783ac;--pinkbg:#3a1f33;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 2rem/1.15 Literata,Georgia,serif;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.band{height:6px;border-radius:3px;background:linear-gradient(var(--blue) 50%,var(--gold) 50%);margin-bottom:16px}
nav{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:inherit;color:var(--muted);cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--gold);font-weight:600}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.letter b{display:block;font:700 1.9rem/1.2 Literata,Georgia,serif}
.letter span{font-size:.82rem;color:var(--muted)}
.letter.new{border-color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.row .uk{font:500 1.2rem/1.3 Literata,Georgia,serif;display:block}
.row .tr{color:var(--blue);font-size:.92rem;display:block}
.row .en{color:var(--muted);font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 18px;text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.big{font:700 1.7rem/1.3 Literata,Georgia,serif}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
:root:not([data-theme="light"]) .btn.pri{color:#0f1a30}
.opt{display:block;width:100%;margin-top:8px;text-align:left}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.muted{color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gold)}
.tip{background:var(--surface);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:.95rem}
.row{padding:0;cursor:default;gap:0;align-items:stretch}
.row .main{flex:1;background:none;border:0;padding:12px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ctl{display:flex;align-items:center;gap:2px;padding-right:6px}
.ctl button{background:none;border:0;min-width:40px;min-height:44px;font-size:1.1rem;color:var(--muted);cursor:pointer;border-radius:8px}
.ctl button.on{color:var(--gold)}
.ctl button:disabled{opacity:.25}
select.btn{margin:0 0 12px;width:100%}
.row.d{background:var(--pinkbg);border-color:var(--pink);border-left:6px solid var(--pink)}
.card.d{background:var(--pinkbg);border-color:var(--pink)}
.dtag{display:block;font-size:.8rem;font-weight:700;color:var(--pink)}
.vtag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:10px;margin-top:4px;border:1px solid}
.vtag.f{color:var(--blue);border-color:var(--blue)}
.vtag.i{color:var(--muted);border-color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
<div class="band"></div>
<h1>Learn Ukrainian</h1>
<p class="sub">Learn the alphabet, then everyday phrases. Tap anything to hear it spoken by a Ukrainian voice.</p>
<nav role="tablist" id="tabs">
<button role="tab" data-t="letters" aria-selected="true">Alphabet</button>
<button role="tab" data-t="phrases" aria-selected="false">Phrases</button>
<button role="tab" data-t="cards" aria-selected="false">Flashcards</button>
<button role="tab" data-t="quiz" aria-selected="false">Quiz</button>
</nav>
<div id="view"></div>
<p class="muted" id="voice"></p>
</div>

let cur_audio=null;
function say(t){try{if(cur_audio){cur_audio.pause()}cur_audio=new Audio(AUD[t]);cur_audio.play().catch(()=>{$("#voice").textContent="Audio was blocked. Tap again, and check your phone isn’t on silent."})}catch(e){}}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

function letters(){
view.innerHTML=`<div class="tip">Ukrainian is written phonetically: once you know the 33 letters, you can read almost any word. Gold-bordered letters look like English ones but sound different.</div><div class="grid">`+L.map((l,i)=>`<button class="letter ${"АВЕИІНОРСУХЬ".includes(l[0])&&!"АЕКМОТ".includes(l[0])?"new":""}" data-i="${i}" aria-label="${l[0]}, ${l[2]}"><b>${l[0]}${l[0]!=="Ь"?l[0].toLowerCase():""}</b><span>${l[1]}</span></button>`).join("")+`</div><p class="muted" id="ld">Tap a letter to hear it and see how it sounds.</p>`;
view.querySelectorAll(".letter").forEach(b=>b.onclick=()=>{const l=L[b.dataset.i];say(l[0]);$("#ld").textContent=`${l[0]}: ${l[2]}`})}

let order=P.map((_,i)=>i),favs=[];
try{const o=JSON.parse(localStorage.getItem("ukro")||"null");if(Array.isArray(o)&&new Set(o).size===o.length&&o.every(i=>Number.isInteger(i)&&i>=0&&i<P.length))order=o.concat(P.map((_,i)=>i).filter(i=>!o.includes(i)));const f=JSON.parse(localStorage.getItem("ukrf")||"[]");if(Array.isArray(f))favs=f}catch(e){}
const saveOrder=()=>{try{localStorage.setItem("ukro",JSON.stringify(order));localStorage.setItem("ukrf",JSON.stringify(favs))}catch(e){}};
function phrases(){
view.innerHTML=`<div class="tip">Tap ☆ to move a phrase to the top, or use ▲ ▼ to place it exactly. Flashcards follow this order. <b>Ви</b> tags are polite (strangers, older people); <b>ти</b> tags are friendly (friends, people you know well).</div>`+order.map((pi,pos)=>{const p=P[pi],f=favs.includes(pi);return `<div class="row${p[3]?" d":""}"><button class="main" data-i="${pi}"><span class="uk">${p[0]}</span><span class="tr">${p[1]}</span><span class="en">${p[2]}</span>${p[3]?'<span class="dtag">♥ dating phrase</span>':""}${p[4]?'<span class="vtag '+p[4]+'">'+(p[4]==="f"?"Ви · formal":"ти · informal")+'</span>':""}</button><div class="ctl"><button data-a="f" data-pos="${pos}" class="${f?"on":""}" aria-label="${f?"Unfavourite":"Favourite and move to top"}">${f?"★":"☆"}</button><button data-a="u" data-pos="${pos}" aria-label="Move up" ${pos===0?"disabled":""}>▲</button><button data-a="d" data-pos="${pos}" aria-label="Move down" ${pos===order.length-1?"disabled":""}>▼</button></div></div>`}).join("");
view.querySelectorAll(".main").forEach(b=>b.onclick=()=>say(P[b.dataset.i][0]));
view.querySelectorAll(".ctl button").forEach(b=>b.onclick=()=>{const pos=+b.dataset.pos,a=b.dataset.a,pi=order[pos],y=scrollY;
if(a==="f"){if(favs.includes(pi))favs=favs.filter(x=>x!==pi);else{favs.push(pi);order.splice(pos,1);order.unshift(pi)}}
else{const t=a==="u"?pos-1:pos+1;if(t<0||t>=order.length)return;[order[pos],order[t]]=[order[t],order[pos]]}
saveOrder();phrases();scrollTo(0,y)})}

let pos=0,shown=false;
function cards(){
const pi=order[pos],p=P[pi],known=P.filter((_,i)=>(prog[i]||0)>=3).length,done=(prog[pi]||0)>=3;
view.innerHTML=`<p class="muted">${known} of ${P.length} learned</p><div class="bar"><i style="width:${known/P.length*100}%"></i></div>
<label class="muted" for="jump">Jump to a card</label>
<select id="jump" class="btn">${order.map((i,k)=>`<option value="${k}" ${k===pos?"selected":""}>${k+1}. ${esc(P[i][2])}</option>`).join("")}</select>
<div class="card${p[3]?" d":""}" id="card"><div class="muted">${pos+1} of ${P.length}${done?" · ✓ learned":""}</div>${p[3]?'<div class="dtag">♥ dating phrase</div>':""}${p[4]?'<span class="vtag '+p[4]+'">'+(p[4]==="f"?"Ви · formal":"ти · informal")+'</span>':""}<div class="big">${esc(p[2])}</div>${shown?`<div class="big" style="color:var(--blue)">${p[0]}</div><div>${p[1]}</div>`:`<div class="muted">Say it out loud, then reveal. Swipe the card to move on.</div>`}</div>
<div class="btns"><button class="btn" id="pv" ${pos===0?"disabled":""}>‹ Prev</button><button class="btn pri" id="rv">${shown?"Hide":"Reveal"}</button><button class="btn" id="nx" ${pos===P.length-1?"disabled":""}>Next ›</button></div>
<div class="btns"><button class="btn" id="h">🔊 Listen</button><button class="btn" id="lr">${done?"Unmark learned":"Mark learned"}</button></div>`;
const go=k=>{pos=Math.max(0,Math.min(P.length-1,k));shown=false;cards()};
$("#jump").onchange=e=>go(+e.target.value);
$("#pv").onclick=()=>go(pos-1);$("#nx").onclick=()=>go(pos+1);
$("#rv").onclick=()=>{shown=!shown;if(shown)say(p[0]);cards()};
$("#h").onclick=()=>say(p[0]);
$("#lr").onclick=()=>{prog[pi]=done?0:3;save();cards()};
let x0=null;const c=$("#card");c.ontouchstart=e=>x0=e.touches[0].clientX;c.ontouchend=e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>50)go(pos+(d<0?1:-1))}}

let q=null;
function quiz(){
if(!q){q={n:0,s:0,list:shuf(P.map((_,i)=>["p",i]).concat(L.filter(l=>l[0]!=="Ь").map((_,i)=>["l",i]))).slice(0,10)}}
if(q.n>=q.list.length){view.innerHTML=`<div class="card"><div class="big">${q.s} / ${q.list.length}</div><div class="muted">${q.s>=8?"Strong work. Try the flashcards to keep it fresh.":"Review the alphabet and phrases, then try again."}</div></div><div class="btns"><button class="btn pri" id="re">New quiz</button></div>`;$("#re").onclick=()=>{q=null;quiz()};return}
const [k,i]=q.list[q.n];let prompt,ans,opts;
if(k==="p"){prompt=`How do you say “${P[i][2]}”?`;ans=P[i][0];opts=shuf(P.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[0])}
else{const l=L.filter(l=>l[0]!=="Ь")[i];prompt=`What sound does “${l[0]}” make?`;ans=l[1];opts=shuf([...new Set(L.map(x=>x[1]).filter(x=>x!==ans&&x!=="’"))]).slice(0,3)}
opts=shuf([ans,...opts]);

view.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===ans)x.classList.add("ok")});
